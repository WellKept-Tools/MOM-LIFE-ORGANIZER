function miniCalendar(){let base=parseDate(today());base.setDate(1);base.setMonth(base.getMonth()+miniOffset);let first=localDate(base),start=weekStart(first),days=Array.from({length:35},(_,i)=>plus(start,i));if(parseDate(plus(start,34)).getMonth()!==base.getMonth()){}else if(parseDate(plus(start,35)).getMonth()===base.getMonth())days=Array.from({length:42},(_,i)=>plus(start,i));let es=occurrences(start,days.at(-1));return`<div class="calendar-heading"><strong>${fmtDate(first,{month:'long',year:'numeric'})}</strong><div class="arrows">${ibtn('previous','miniPrev','left')}${ibtn('next','miniNext','chevron')}</div></div><div class="mini-grid">${Array.from({length:7},(_,i)=>`<div class="weekday">${fmtDate(plus(start,i),{weekday:'narrow'})}</div>`).join('')}${days.map(d=>`<button class="day ${parseDate(d).getMonth()!==base.getMonth()?'other':''} ${d===today()?'today':''} ${es.some(e=>e.occurrence===d)?'has-event':''}" data-calendar-date="${d}" aria-label="${esc(fmtDate(d,{dateStyle:'full'}))}">${parseDate(d).getDate()}</button>`).join('')}</div>`}
function occurrences(start,end){const list=[];const requestedStart=start;for(let r of state.records.calendar){if(!r.date)continue;start=plus(requestedStart,-(r.endDate?Math.max(0,dateDiff(r.endDate,r.date)):0));let dates=[r.date],repeat=r.repeat;if(repeat&&repeat!=='none'){dates=[];if(repeat==='daily'||repeat==='weekly'){let step=repeat==='daily'?1:7,offset=Math.max(0,Math.floor(dateDiff(start,r.date)/step));for(let d=plus(r.date,offset*step);d<=end;d=plus(d,step)){if(d>=start&&(!r.until||d<=r.until))dates.push(d);if(dates.length>500)break}}else{let base=parseDate(r.date),sy=parseDate(start),ey=parseDate(end);if(repeat==='monthly'){let count=Math.max(0,(sy.getFullYear()-base.getFullYear())*12+sy.getMonth()-base.getMonth());for(let i=count;i<count+Math.min(240,(ey.getFullYear()-sy.getFullYear())*12+ey.getMonth()-sy.getMonth()+3);i++){let d=new Date(base.getFullYear(),base.getMonth()+i,1,12);let day=base.getDate();if(day>new Date(d.getFullYear(),d.getMonth()+1,0).getDate())continue;d.setDate(day);let s=localDate(d);if(s>=start&&s<=end&&(!r.until||s<=r.until))dates.push(s)}}else if(repeat==='yearly'){for(let y=Math.max(base.getFullYear(),sy.getFullYear());y<=ey.getFullYear();y++){let dt=new Date(y,base.getMonth(),base.getDate(),12),s=localDate(dt);if(dt.getMonth()!==base.getMonth())continue;if(s>=r.date&&s>=start&&s<=end&&(!r.until||s<=r.until))dates.push(s)}}}}for(let d of dates){if(r.exceptions?.includes(d))continue;let duration=r.endDate?Math.max(0,dateDiff(r.endDate,r.date)):0;let occurrenceEnd=plus(d,duration);if(occurrenceEnd>=requestedStart&&d<=end)list.push({...r,occurrence:d,occurrenceEnd})}}return list.sort((a,b)=>(a.occurrence+(a.time||'00:00')).localeCompare(b.occurrence+(b.time||'00:00')))}

function drawModal(){const activeElement=document.activeElement,activeInDialog=$('#dialog').contains(activeElement),activeId=activeElement?.id,activeSetting=activeElement?.dataset?.setting;let c=modalContext;if(!c)return;let html='';if(c.type==='form')html=recordForm(c);if(c.type==='quick'){let modules=['tasks','calendar','family','chores','meals','groceries','routines','journal','budget','reminders'].filter(enabled);html=modalHead(t('quickAdd'),t('quickAddHint'))+`<div class="modal-body quick-grid">${modules.map(m=>`<button class="quick-item" data-quick-module="${m}">${icon(DEMO&&locked.includes(m)?'lock':m)}${t(m)}</button>`).join('')}</div>`}if(c.type==='confirm')html=modalHead(t(c.title||'confirmDelete'))+`<div class="modal-body"><p>${c.textKey?t(c.textKey,c.values||{}):esc(c.text||t('deleteHint'))}</p></div>`+modalFoot(btn(c.label||'confirm','confirmAction',c.icon||'check',c.danger?'danger':'primary'));if(c.type==='info')html=modalHead(t(c.title))+`<div class="modal-body"><p>${t(c.message,c.values||{})}</p>${c.extra||''}</div>`+modalFoot('','close');if(c.type==='theme')html=modalHead(t('appearance'))+`<div class="modal-body quick-grid">${['light','dark','system'].map(th=>`<button class="quick-item" data-theme="${th}" aria-pressed="${state.settings.theme===th}">${icon(th==='dark'?'moon':'sun')}${t(th)}</button>`).join('')}</div>`;if(c.type==='search')html=modalHead(t('searchAll'))+`<div class="modal-body"><label class="field"><span class="visually-hidden">${t('search')}</span><input type="search" id="global-search" value="${esc(c.q||'')}" placeholder="${esc(t('searchHint'))}"></label><div id="global-results" style="margin-top:15px">${searchResults(c.q||'')}</div></div>`;if(c.type==='widgets')html=modalHead(t('widgets'))+`<div class="modal-body toggle-list">${['priorities','calendar','meals','chores','wellness','routines'].map(w=>`<label><input type="checkbox" data-widget="${w}" ${state.settings.widgets.includes(w)?'checked':''}>${t(w==='priorities'?'todaysPriori function inputField(f,r){let val=r[f.key]??'',id='f-'+f.key,type=f.type,label=f.key==='kind'?'category':f.key==='steps'?'steps':f.key;let attrs=`id="${id}" name="${f.key}" ${f.required?'required':''}`;let input='',wide=['textarea','steps','file'].includes(type)||['title','topThree'].includes(f.key);if(type==='select')input=`<select ${attrs}>${f.options.map(x=>`<option value="${x}" ${String(val)===x?'selected':''}>${t(x)}</option>`).join('')}</select>`;else if(type==='member'||type==='child')input=`<select ${attrs}>${membersOptions(val,type==='child')}</select>`;else if(type==='recipe')input=`<select ${attrs}><option value="">${t('none')}</option>${state.records.recipes.map(x=>`<option value="${esc(x.id)}" ${val===x.id?'selected':''}>${esc(D(x.title))}</option>`).join('')}</select>`;else if(type==='checkbox')input=`<input type="checkbox" ${attrs} ${val?'checked':''}>`;else if(type==='textarea'||type==='steps')input=`<textarea ${attrs} maxlength="${type==='steps'?10000:50000}" rows="${f.key==='notes'?4:3}">${esc(type==='steps'?(Array.isArray(val)?val.map(D).join('\n'):val):D(val))}</textarea>`;else if(type==='file')input=`<input type="file" ${attrs} accept="image/png,image/jpeg,image/webp,image/gif">${val?`<div>${avatar({title:r.title,avatar:val})}${btn('delete','removeDraftAvatar','delete','tiny')}</div>`:''}`;else input=`<input type="${type}" ${attrs} value="${esc(type==='text'?D(val):val)}" ${type==='number'?`min="0" max="${f.key==='progress'?100:f.key==='energy'?5:f.key==='sleep'?24:100000000}" step="${['progress','points','pointsCost','energy'].includes(f.key)?1:'.01'}"`:type==='text'?'maxlength="500"':''}>`;return`<label class="field ${wide?'wide':''} ${type==='checkbox'?'inline':''}" for="${id}">${type==='checkbox'?input:''}<span>${t(label)}${f.required?' *':''}</span>${type!=='checkbox'?input:''}</label>`}

function guard(m,r=null,id=null){if(conflicted){toast('conflict',true);return false}if(!DEMO)return true;if(locked.includes(m)){showModal({type:'info',title:'proAvailable',message:'proInfoText'});return false}let records=state.records[m]||[],other=records.filter(x=>x.id!==id),limit=m==='tasks'?10:m==='recipes'?3:m==='groceries'?15:m==='routines'?1:m==='journal'?5:null;if(m==='chores'&&!id){showModal({type:'info',title:'proAvailable',message:'limitReached'});return false}if(limit!==null&&(m==='tasks'?other.filter(x=>!x.done).length+(r?.done?0:1)>limit:other.length+1>limit)){showModal({type:'info',title:'proAvailable',message:'limitReached'});return false}if(m==='family'&&r){let role=r.role||'adult';if(role==='babyRole'||other.filter(x=>x.role===role).length>=1){showModal({type:'info',title:'proAvailable',message:'limitReached'});return false}}if(m==='calendar'&&r){let ws=weekStart(today());if(!r.date||r.date<ws||r.date>plus(ws,6)||r.endDate&&r.endDate>plus(ws,6)||r.repeat&&r.repeat!=='none'){toast('demoHorizon',true);return false}}if(m==='meals'&&r&&(!r.date||r.date<today()||r.date>plus(today(),2))){toast('demoHorizon',true);return false}if(m==='wellness'){showModal({type:'info',title:'proAvailable',message:'proInfoText'});return false}return true}
function openRecord(m,id=null,initial={}){if(!schemas[m]||!enabled(m)){toast('optionalDisabled');return}if(DEMO&&locked.includes(m)){guard(m);return}let existing=id&&state.records[m].find(x=>x.id===id);let draft=existing?structuredClone(existing):{title:'',date:today(),priority:'medium',repeat:'none',category:schemas[m].find(f=>f.key==='category')?.options?.[0]||'',role:'adult',kind:'expense',time:'',steps:[],color:'#edd0ca',quantity:1,price:0,servings:4,listName:t('weeklyShop'),schedule:'daily',status:'planned',...initial};if(!existing&&DEMO&&['recipes','groceries','routines','journal','chores','tasks'].includes(m)&&!guard(m,draft))return;showModal({type:'form',module:m,id:existing?.id||null,draft})}
